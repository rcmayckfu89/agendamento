<!DOCTYPE html>
<html lang="pt-BR" class="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda+</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style type="text/tailwindcss">
    @layer base {
        :root {
          --background: 195 20% 98%;
          --foreground: 195 45% 10%;
          --card: 0 0% 100%;
          --card-foreground: 195 45% 10%;
          --popover: 0 0% 100%;
          --popover-foreground: 195 45% 10%;
          --primary: 195 45% 18%;
          --primary-foreground: 195 20% 98%;
          --secondary: 195 15% 92%;
          --secondary-foreground: 195 45% 15%;
          --muted: 195 10% 94%;
          --muted-foreground: 195 20% 40%;
          --accent: 175 80% 40%;
          --accent-foreground: 0 0% 100%;
          --destructive: 15 90% 50%;
          --destructive-foreground: 210 20% 98%;
          --border: 195 20% 90%;
          --input: 195 20% 90%;
          --ring: 175 80% 40%;
          --radius: 0.75rem;
        }

        .dark {
          --background: 195 45% 5%;
          --foreground: 195 20% 98%;
          --card: 195 45% 7%;
          --card-foreground: 195 20% 98%;
          --popover: 195 45% 7%;
          --popover-foreground: 195 20% 98%;
          --primary: 175 80% 40%;
          --primary-foreground: 195 45% 5%;
          --secondary: 195 45% 15%;
          --secondary-foreground: 195 20% 98%;
          --muted: 195 45% 12%;
          --muted-foreground: 195 20% 65%;
          --accent: 175 80% 40%;
          --accent-foreground: 195 45% 5%;
          --destructive: 15 90% 40%;
          --destructive-foreground: 210 20% 98%;
          --border: 195 45% 15%;
          --input: 195 45% 15%;
          --ring: 175 80% 40%;
        }
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        font-size: 22px;
        vertical-align: middle;
      }

      .chart-ring {
        stroke-dasharray: 0, 100;
        transition: stroke-dasharray 1s ease-out;
      }
      
      /* Vanguard Clinical Animations */
      @keyframes syncSlide {
        from {
          transform: translateX(10px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      
      @keyframes precisionFade {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes clickEffect {
        0% { transform: scale(1); }
        50% { transform: scale(0.98); }
        100% { transform: scale(1); }
      }

      .animate-sync-slide {
        animation: syncSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .animate-precision-fade {
        animation: precisionFade 0.3s ease-out both;
      }

      .active-click:active {
        animation: clickEffect 0.15s ease-out forwards;
      }
      
      /* Subtle Grain Overlay */
      .grain-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.02;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Stagger delays */
      .stagger-1 { animation-delay: 0.05s; }
      .stagger-2 { animation-delay: 0.1s; }
      .stagger-3 { animation-delay: 0.15s; }
      .stagger-4 { animation-delay: 0.2s; }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: hsl(var(--border));
        border-radius: 10px;
      }
    </style>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))'
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))'
            },
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))'
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))'
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))'
            },
            popover: {
              DEFAULT: 'hsl(var(--popover))',
              foreground: 'hsl(var(--popover-foreground))'
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))'
            }
          },
          fontFamily: {
            display: ["Inter", "sans-serif"],
            sans: ["Inter", "sans-serif"],
          },
          fontSize: {
            'xs': ['0.8125rem', { lineHeight: '1.25rem' }],   // 13px
            'sm': ['0.875rem', { lineHeight: '1.5rem' }],     // 14px
            'base': ['1rem', { lineHeight: '1.6rem' }],       // 16px
            'lg': ['1.125rem', { lineHeight: '1.75rem' }],    // 18px
            'xl': ['1.25rem', { lineHeight: '1.75rem' }],     // 20px
            '2xl': ['1.5rem', { lineHeight: '2rem' }],        // 24px
            '3xl': ['1.875rem', { lineHeight: '2.25rem' }],   // 30px
            '4xl': ['2.25rem', { lineHeight: '2.5rem' }],     // 36px
            '5xl': ['3rem', { lineHeight: '1' }],             // 48px
          },
          borderRadius: {
            lg: `var(--radius, 1rem)`,
            md: `calc(var(--radius, 1rem) - 4px)`,
            sm: 'calc(var(--radius, 1rem) - 8px)'
          },
          boxShadow: {
            'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -2px rgba(0, 0, 0, 0.03)',
            'soft-lg': '0 10px 15px -3px rgba(0, 0, 0, 0.03), 0 4px 6px -4px rgba(0, 0, 0, 0.03)',
          }
        },
      },
    };
  </script>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="font-display bg-background text-foreground custom-scrollbar text-base antialiased selection:bg-accent/20">
  <div class="grain-overlay"></div>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
